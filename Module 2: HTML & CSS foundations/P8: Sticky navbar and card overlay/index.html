<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P8 - Sticky Navbar and Project Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <nav class="nav" aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>Hi, I'm Harsh Raj</h1>
      <p>First-year B.Tech CSE student learning web development.</p>
    </section>

    <section id="about" class="section">
      <h2>About Me</h2>
      <p>I enjoy learning programming, HTML, and CSS.</p>
    </section>

    <section id="projects" class="section">
      <h2>Projects</h2>
      <div class="cards">
        <article class="card">
          <div class="card-image image-one" role="img" aria-label="Blue abstract project background"></div>
          <div class="overlay">
            <h3>Portfolio</h3>
            <p>A simple personal website.</p>
          </div>
        </article>
        <article class="card">
          <div class="card-image image-two" role="img" aria-label="Green abstract project background"></div>
          <div class="overlay">
            <h3>Web Lab</h3>
            <p>HTML and CSS practice.</p>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Harsh Raj</p>
  </footer>
</body>
</html>
